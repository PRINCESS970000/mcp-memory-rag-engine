[pytest]
# test_runner.py is a live evaluation harness -- it calls the real Mistral
# API and requires MISTRAL_API_KEY, unlike test_lab.py's unit tests, which
# run offline with mocked LLM/Environment. Excluded so `pytest` alone
# doesn't fail collection when no API key is set; run it directly with
# `python tests/test_runner.py` instead.
addopts = --ignore=tests/test_runner.py